name: Publish hostnet variant

# Builds the unofficial "myspeed-hostnet" image for amd64 + arm64 and publishes it to GHCR and Docker Hub.
# Trigger manually, or push a tag like "hostnet-1.0.9.1" (-> image tag 1.0.9-hostnet.1).
# Tags must NOT start with "v": create_release.yml (upstream) reacts to v* tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 1.0.9-hostnet.1)"
        required: true
        default: "1.0.9-hostnet.1"
  push:
    tags: ["hostnet-*"]

concurrency:
  group: publish-hostnet
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/jrobertoma/myspeed-hostnet
  DOCKERHUB_IMAGE: docker.io/jrobertoma/myspeed-hostnet
  DESCRIPTION: "Unofficial MySpeed variant for Docker network_mode: host (based on gnmyt/myspeed)"

jobs:
  prepare:
    name: "Resolve version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#hostnet-}"
            version="${v%.*}-hostnet.${v##*.}"
          else
            version="${INPUT_VERSION}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-hostnet\.[0-9]+$'; then
            echo "Invalid version: $version" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: "Docker (${{ matrix.platform }})"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.title=MySpeed (hostnet variant)
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=JRobertoMA
            org.opencontainers.image.source=https://github.com/JRobertoMA/MySpeed
            org.opencontainers.image.url=https://github.com/JRobertoMA/MySpeed/blob/hostnet/HOSTNET.md
            org.opencontainers.image.base.name=germannewsmaker/myspeed:1.0.9

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hostnet-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=hostnet-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Publish multi-arch manifests"
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push to both registries
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${VERSION}" -t "${GHCR_IMAGE}:latest" \
            -t "${DOCKERHUB_IMAGE}:${VERSION}" -t "${DOCKERHUB_IMAGE}:latest" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/JRobertoMA/MySpeed" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect published images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: jrobertoma/myspeed-hostnet
          short-description: "Unofficial MySpeed variant for network_mode: host (amd64/arm64)"
          readme-filepath: ./HOSTNET.md
